[Rainmeter]
Update=1000
Author=Morteza Nasirivand
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
LeftMouseDoubleClickAction=!ToggleConfig "Comforta\Settings" "Settings.ini"

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureTime]
Measure=Time
Format=%#Format#:%M

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureDay]
Measure=Time
Format=%A
Substitute=#Date#

[MeasureDate]
Measure=Time
Format=%d %B
Substitute=#Date#

;-------------------------------------------------------------
;-------------------------------------------------------------

[Meter24hTime]
Meter=String
MeasureName=MeasureTime
StringAlign=Center
FontColor=255,255,255
FontFace=GeosansLight
FontSize=40
X=180
Y=50
Text="%1"
InlinePattern=".*"
InlineSetting=CharacterSpacing | 1 | 1
DynamicVariables=1
AntiAlias=1
Hidden=#Hidden#

[Meter12hTime]
Meter=String
MeasureName=MeasureTime
MeasureName2=MeasureAMPM
StringAlign=Center
FontColor=255,255,255
FontFace=GeosansLight
FontSize=40
X=180
Y=50
Text="%1 %2"
InlinePattern="[MeasureAMPM]"
InlineSetting=Size | 14
InlinePattern2=".*"
InlineSetting2=CharacterSpacing | 1 | 1
DynamicVariables=1
AntiAlias=1
Hidden=#Hidden2#

[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Center
FontColor=255,255,255
FontFace=GeosansLight
FontSize=20
X=180
Y=105
Text="%1"
InlinePattern=".*"
InlineSetting=CharacterSpacing | 1 | 1
DynamicVariables=1
AntiAlias=1

[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
FontColor=255,255,255,90
FontFace=Ruthligos
FontSize=70
X=180
Y=0
Text="%1"
InlinePattern=".*"
InlineSetting=CharacterSpacing | 1 | 1
DynamicVariables=1
AntiAlias=1